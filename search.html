<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>

    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
    <link rel="icon" href="assets/icon/icon.png">
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <header data-aos="fade-down">
        <div class="left">
            <a href="index.html" class="header-home-link" aria-label="Go to home page" tabindex="0">
                <img src="assets/icon/icon.png" alt="Movie Loader logo">
                <h1>Movie Loader</h1>
            </a>
        </div>

        <nav aria-label="Main navigation">
            <a href="index.html" class="link">Home</a>
            <a href="search.html" class="link disabled">Search</a>
            <a href="watchlist.html" class="link">Watchlist</a>
        </nav>

        <img src="assets/icon/hamburger.png" id="hamburger-button" alt="" aria-label="Open menu">

        <div class="hamburger-overlay" id="hamburger-overlay"></div>

        <nav class="hamburger-menu" id="hamburger-menu" aria-label="Mobile navigation">
            <a href="index.html" class="link">Home</a>
            <a href="search.html" class="link disabled">Search</a>
            <a href="watchlist.html" class="link">Watchlist</a>
        </nav>
    </header>

    <main>
        <div class="searchBar searchSearchBar">
            <input 
                type="text" 
                placeholder="Start typing to search a movie..." 
                class="searchInput" 
                id="searchInput"
                aria-label="Search for a movie"
            >
        </div>

        <section class="search" id="search" data-aos="fade-up">
            <div id="results-info" class="results-info" aria-live="polite"></div>
            <div id="search-container"></div>
            <div id="end-message" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        <div class="top-side">
            <div class="logo-side">
                <img src="assets/icon/icon.png" alt="Movie Loader logo">
                <div class="text">
                    <h4>Movie Loader</h4>
                    <p>What are you going to watch tonight?</p>
                </div>
            </div>

            <div class="link-side">
                <h4>Site</h4>
                <a href="index.html" class="link">Home</a>
                <a href="search.html" class="link">Search</a>
                <a href="watchlist.html" class="link">Watchlist</a>
            </div>
        </div>

        <hr>

        <p>© 2025 Movie Loader - All rights reserved</p>
    </footer>

    <script type="module" src="script/common.js"></script>
    <script src="script/components/hamburger.js"> </script>
    <script src="script/helpers/loader.js"></script>
    <script type="module" src="script/main/search.js"></script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>
</html>
