<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Loader</title>

    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">

    <link rel="icon" href="assets/icon/icon.png">
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>
    
    <header data-aos="fade-down">
        <div class="left">
            <img src="assets/icon/icon.png" alt="Movie Loader logo">
            <h1>Movie Loader</h1>
        </div>

        <nav aria-label="Main navigation">
            <a href="#" class="link disabled">Home</a>
            <a href="search.html" class="link">Search</a>
            <a href="watchlist.html" class="link">Watchlist</a>
        </nav>

        <img src="assets/icon/hamburger.png" id="hamburger-button">

        <div class="hamburger-overlay" id="hamburger-overlay"></div>

        <nav class="hamburger-menu" id="hamburger-menu" aria-label="Mobile navigation">
            <a href="#" class="link disabled">Home</a>
            <a href="search.html" class="link">Search</a>
            <a href="watchlist.html" class="link">Watchlist</a>
        </nav>
    </header>

    <section class="hero">
        <h3 data-aos="zoom-in">What are you going to watch tonight?</h3>

        <div class="searchBar indexSearchBar" data-aos="zoom-in">
            <input 
                type="text" 
                placeholder="Search a movie..." 
                class="searchInput" 
                id="searchInput" 
                aria-label="Search for a movie"
            >
            <button class="searchBtn" id="searchBtn" aria-label="Search">
                <img src="assets/icon/search.svg" alt="">
            </button>
        </div>

        <a href="#trending" class="scrollHint" aria-label="Scroll to trending movies">
            <span class="arrow" aria-hidden="true">⌄</span>
        </a>
    </section>

    <main>
        <section class="trending" id="trending" data-aos="fade-up">
            <h2>Trending Movies</h2>
            <div id="trending-container"></div>
        </section>

        <section class="discover" id="discover" data-aos="fade-up">
            <h2>Discover</h2>
            <div id="discover-container" class="discover-container"></div>
            <button id="load-more">Discover More</button>
        </section>
    </main>

    <footer data-aos="fade-up">
        <div class="top-side">
            <div class="logo-side">
                <img src="assets/icon/icon.png" alt="Movie Loader logo">
                <div class="text">
                    <h4>Movie Loader</h4>
                    <p>What are you going to watch tonight?</p>
                </div>
            </div>

            <div class="link-side">
                <h4>Site</h4>
                <a href="index.html" class="link">Home</a>
                <a href="search.html" class="link">Search</a>
                <a href="watchlist.html" class="link">Watchlist</a>
            </div>
        </div>

        <hr>

        <p>© 2025 Movie Loader - All rights reserved</p>
    </footer>

    <script type="module" src="script/common.js"></script>
    <script src="script/components/hamburger.js"></script>
    <script src="script/helpers/loader.js"></script>
    <script type="module" src="script/main/index.js"></script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>
</html>
