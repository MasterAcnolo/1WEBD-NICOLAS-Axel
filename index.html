<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Loader</title>

    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" >

    <link rel="icon" href="assets/icon/icon.png">
</head>
<body>
    <header data-aos="fade-down">
        <div class="left">
            <img src="assets/icon/icon.png">
            <h1> Movie Loader </h1>
        </div>

       
        <div class="searchBar">
            <input type="text" placeholder="Search a movie..." class="searchInput">
            <button class="searchBtn"> <img src="assets/icon/search.svg"></button>
        </div>

    </header>

    <section class="hero" >
        <h3 data-aos="zoom-in"> What are you going to watch tonight ? </h3>
    </section>

    <main>
        <section class="trending" id="trending" data-aos="fade-up">

            <h2> Trendings Movies </h2>
            
            <div id="trending-container"></div>

        </section>

        <section class="discover" id="discover" data-aos="fade-up">

            <h2> Discover </h2>

            <div id="discover-container" class="discover-container"></div>
        </section>


    </main>

    <footer data-aos="fade-up">
        <div class="top-side">
            <div class="logo-side">
                <img src="assets/icon/icon.png">
                <div class="text">
                    <h4> Movie Loader </h4>
                    <p> What are you going to watch tonight ?</p>
                </div>
            </div>

            <div class="link-side">
                <h4> Site </h4>
                <a href="index.html"> Home </a>
                <a href="index.html"> Search </a>
            </div>
        </div>

        <hr>

        <p> © 2025 Movie Loader - All rights reserved</p>
    </footer>
    

    <script type="module" src="script/common.js"></script>
    <script type="module" src="script/main/index.js"></script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

</body>
</html>
